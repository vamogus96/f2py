name: checks
on:
  push:
    paths: ['dream-horror/**', '.github/workflows/license-check.yml']
  pull_request:
    paths: ['dream-horror/**', '.github/workflows/license-check.yml']
permissions:
  contents: read
jobs:
  licenses:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dream-horror
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run check:licenses
      - run: npm run test:physics
